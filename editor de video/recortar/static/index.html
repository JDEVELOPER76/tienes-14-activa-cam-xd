<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recortador de Video sin Pérdida</title>
<style>
    :root {
        --bg: #0f1115;
        --card: #181b22;
        --card-hover: #1f232b;
        --border: #2a2f3a;
        --primary: #4f8cff;
        --primary-hover: #3a78e8;
        --success: #22c55e;
        --error: #ef4444;
        --text: #e6e9ef;
        --text-dim: #8b93a7;
        --radius: 14px;
        --shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a1f2b 0%, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .container {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 32px;
        animation: fadeUp .6s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: -.02em;
        background: linear-gradient(90deg, #fff, #9db4e0);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 6px;
    }

    .subtitle {
        font-size: .85rem;
        color: var(--text-dim);
        margin-bottom: 24px;
    }

    /* --- Drop zone --- */
    .dropzone {
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        padding: 38px 20px;
        text-align: center;
        cursor: pointer;
        transition: border-color .25s, background .25s, transform .25s;
        position: relative;
        overflow: hidden;
    }

    .dropzone:hover,
    .dropzone.dragover {
        border-color: var(--primary);
        background: rgba(79,140,255,.06);
        transform: scale(1.01);
    }

    .dropzone.dragover { animation: pulse 1s infinite; }

    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(79,140,255,.4); }
        50%      { box-shadow: 0 0 0 12px rgba(79,140,255,0); }
    }

    .dropzone .icon {
        font-size: 2.4rem;
        margin-bottom: 10px;
        display: block;
        transition: transform .3s;
    }

    .dropzone:hover .icon { transform: translateY(-4px) scale(1.1); }

    .dropzone p {
        font-size: .92rem;
        color: var(--text-dim);
    }

    .dropzone strong { color: var(--primary); }

    input[type="file"] { display: none; }

    /* --- Preview --- */
    .preview-wrap {
        margin-top: 20px;
        border-radius: var(--radius);
        overflow: hidden;
        background: #000;
        display: none;
        animation: fadeUp .5s;
    }

    .preview-wrap video { width: 100%; display: block; }

    /* --- Controls --- */
    .controls {
        margin-top: 22px;
        display: none;
        animation: fadeUp .5s;
    }

    .controls.visible { display: block; }

    .field {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
    }

    .field > label {
        width: 80px;
        font-size: .85rem;
        color: var(--text-dim);
        flex-shrink: 0;
    }

    /* --- Time group (min : seg) --- */
    .time-group {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 4px 10px;
        transition: border-color .2s, box-shadow .2s;
    }

    .time-group:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79,140,255,.15);
    }

    .time-group input {
        width: 52px;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: .95rem;
        text-align: center;
        padding: 6px 2px;
        -moz-appearance: textfield;
    }

    .time-group input::-webkit-outer-spin-button,
    .time-group input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .time-group input:focus { outline: none; }

    .time-group .sep {
        color: var(--text-dim);
        font-weight: 700;
        font-size: 1rem;
    }

    .time-group .unit {
        font-size: .72rem;
        color: var(--text-dim);
        margin-left: 2px;
    }

    .duration-info {
        font-size: .8rem;
        color: var(--text-dim);
        margin-bottom: 18px;
        text-align: center;
    }

    /* --- Button --- */
    .btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        font-size: .95rem;
        font-weight: 600;
        color: #fff;
        background: var(--primary);
        cursor: pointer;
        transition: background .2s, transform .1s, box-shadow .2s;
        position: relative;
        overflow: hidden;
    }

    .btn:hover:not(:disabled) {
        background: var(--primary-hover);
        box-shadow: 0 6px 20px rgba(79,140,255,.35);
    }

    .btn:active:not(:disabled) { transform: scale(.98); }

    .btn:disabled {
        background: #2a2f3a;
        color: var(--text-dim);
        cursor: not-allowed;
    }

    .btn .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .7s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
    }

    .btn.loading .spinner { display: inline-block; }
    .btn.loading .label { opacity: .8; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Status --- */
    .status {
        margin-top: 16px;
        font-size: .85rem;
        text-align: center;
        min-height: 20px;
        transition: color .2s;
    }

    .status.error { color: var(--error); animation: shake .4s; }
    .status.ok    { color: var(--success); }

    @keyframes shake {
        0%,100% { transform: translateX(0); }
        25%     { transform: translateX(-6px); }
        75%     { transform: translateX(6px); }
    }

    /* --- Toast --- */
    .toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--success);
        color: #fff;
        padding: 12px 22px;
        border-radius: 10px;
        font-size: .88rem;
        font-weight: 600;
        box-shadow: var(--shadow);
        opacity: 0;
        transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .4s;
        pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="container">
    <h1>Recortador de Video</h1>
    <p class="subtitle">Corte sin pérdida de calidad · FFmpeg <code>-c copy</code></p>

    <div class="dropzone" id="dropzone">
        <span class="icon">🎬</span>
        <p><strong>Haz clic</strong> o arrastra un video aquí</p>
    </div>
    <input type="file" id="fileInput" accept="video/*">

    <div class="preview-wrap" id="previewWrap">
        <video id="preview" controls></video>
    </div>

    <div class="controls" id="controls">
        <!-- Inicio -->
        <div class="field">
            <label>Inicio</label>
            <div class="time-group">
                <input type="number" id="startMin" value="0" min="0" step="1">
                <span class="unit">min</span>
                <span class="sep">:</span>
                <input type="number" id="startSec" value="0" min="0" max="59" step="1">
                <span class="unit">seg</span>
            </div>
        </div>

        <!-- Fin -->
        <div class="field">
            <label>Fin</label>
            <div class="time-group">
                <input type="number" id="endMin" value="0" min="0" step="1">
                <span class="unit">min</span>
                <span class="sep">:</span>
                <input type="number" id="endSec" value="0" min="0" max="59" step="1">
                <span class="unit">seg</span>
            </div>
        </div>

        <p class="duration-info" id="durationInfo"></p>
        <button class="btn" id="trimBtn">
            <span class="spinner"></span>
            <span class="label">Recortar y descargar</span>
        </button>
    </div>

    <p class="status" id="status"></p>
</div>

<div class="toast" id="toast">✅ ¡Descarga iniciada!</div>

<script>
    // ⚙️ Ajusta esto si tu backend está en otro puerto/dominio
    const API = ''; // ej: 'http://localhost:8000'

    const dropzone     = document.getElementById('dropzone');
    const fileInput    = document.getElementById('fileInput');
    const preview      = document.getElementById('preview');
    const previewWrap  = document.getElementById('previewWrap');
    const controls     = document.getElementById('controls');
    const startMin     = document.getElementById('startMin');
    const startSec     = document.getElementById('startSec');
    const endMin       = document.getElementById('endMin');
    const endSec       = document.getElementById('endSec');
    const durationInfo = document.getElementById('durationInfo');
    const trimBtn      = document.getElementById('trimBtn');
    const statusEl     = document.getElementById('status');
    const toast        = document.getElementById('toast');

    let uploadedFilename = null;
    let totalDuration = 0;

    // --- Helpers de tiempo ---
    function formatTime(totalSeconds) {
        const m = Math.floor(totalSeconds / 60);
        const s = Math.floor(totalSeconds % 60);
        return `${m}:${String(s).padStart(2, '0')}`;
    }

    /** Rellena los 4 inputs a partir de una cantidad de segundos. */
    function setTimeInputs(totalSeconds, which) {
        const m = Math.floor(totalSeconds / 60);
        const s = Math.floor(totalSeconds % 60);

        if (which === 'start' || which === 'both') {
            startMin.value = m;
            startSec.value = s;
        }
        if (which === 'end' || which === 'both') {
            endMin.value = m;
            endSec.value = s;
        }
    }

    /** Lee un par (min, seg) y devuelve los segundos totales. */
    function readTimeInputs(minInput, secInput) {
        const m = parseInt(minInput.value, 10) || 0;
        const s = parseInt(secInput.value, 10) || 0;
        return m * 60 + s;
    }

    /** Normaliza los segundos: si son >= 60 los pasa a minutos. */
    function normalizeTimeInputs(minInput, secInput) {
        let m = parseInt(minInput.value, 10) || 0;
        let s = parseInt(secInput.value, 10) || 0;

        if (s >= 60) {
            m += Math.floor(s / 60);
            s = s % 60;
        }
        if (s < 0) s = 0;
        if (m < 0) m = 0;

        minInput.value = m;
        secInput.value = s;
    }

    // --- Dropzone ---
    dropzone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(ev =>
        dropzone.addEventListener(ev, e => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        })
    );

    ['dragleave', 'drop'].forEach(ev =>
        dropzone.addEventListener(ev, e => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
        })
    );

    dropzone.addEventListener('drop', e => {
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    // --- Manejo del archivo ---
    async function handleFile(file) {
        if (!file.type.startsWith('video/')) {
            setStatus('El archivo no es un video.', 'error');
            return;
        }

        // Previsualización local
        preview.src = URL.createObjectURL(file);
        previewWrap.style.display = 'block';
        controls.classList.remove('visible');

        setStatus('Subiendo video…');

        const formData = new FormData();
        formData.append('video', file);

        try {
            const res = await fetch(API + '/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Error al subir');

            uploadedFilename = data.filename;
            totalDuration = data.duration;

            setTimeInputs(0, 'start');
            setTimeInputs(totalDuration, 'end');

            durationInfo.textContent =
                `⏱ Duración total: ${formatTime(totalDuration)} (${totalDuration.toFixed(2)} s)`;

            controls.classList.add('visible');
            setStatus('Listo para recortar.', 'ok');
        } catch (err) {
            setStatus('Error: ' + err.message, 'error');
        }
    }

    // --- Normalizar al salir de los inputs de segundos ---
    startSec.addEventListener('change', () => normalizeTimeInputs(startMin, startSec));
    endSec.addEventListener('change',   () => normalizeTimeInputs(endMin, endSec));

    // --- Recorte ---
    trimBtn.addEventListener('click', async () => {
        if (!uploadedFilename) return;

        // Normaliza antes de leer
        normalizeTimeInputs(startMin, startSec);
        normalizeTimeInputs(endMin, endSec);

        const start = readTimeInputs(startMin, startSec);
        const end   = readTimeInputs(endMin, endSec);

        if (end <= start) {
            setStatus('Rango inválido: el fin debe ser mayor que el inicio.', 'error');
            return;
        }

        if (end > totalDuration) {
            setStatus(`El fin supera la duración total (${formatTime(totalDuration)}).`, 'error');
            return;
        }

        setLoading(true);
        setStatus('Recortando con FFmpeg…');

        try {
            const res = await fetch(API + '/trim', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: uploadedFilename, start, end })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Error al recortar');

            setStatus(`¡Listo! ${formatTime(start)} → ${formatTime(end)}`, 'ok');
            showToast('✅ ¡Descarga iniciada!');

            // Descarga
            window.location.href = API + '/download/' + data.output;
        } catch (err) {
            setStatus('Error: ' + err.message, 'error');
        } finally {
            setLoading(false);
        }
    });

    // --- Helpers ---
    function setStatus(msg, type = '') {
        statusEl.textContent = msg;
        statusEl.className = 'status ' + type;
    }

    function setLoading(on) {
        trimBtn.disabled = on;
        trimBtn.classList.toggle('loading', on);
        trimBtn.querySelector('.label').textContent =
            on ? 'Procesando…' : 'Recortar y descargar';
    }

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
    }
</script>
</body>
</html>
